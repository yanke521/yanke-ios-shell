# XcodeGen 工程描述。
#
# 为什么不直接提交 .xcodeproj：那玩意儿是个几百行的 pbxproj，手写容易写错、
# 改一个设置要动十几处、而且冲突起来没法看。这份 yml 在 CI 上一条
# `xcodegen generate` 就还原成完整工程，可读也可改。
#
# 本地要改的话：brew install xcodegen && xcodegen generate && open YanKe.xcodeproj

name: YanKe
options:
  bundleIdPrefix: xyz.yanke521
  deploymentTarget:
    iOS: "16.0"     # WKWebView.themeColor 要 15+，underPageBackgroundColor 要 15+；
                    # 16 是个安全的下限，比这更老的机器她也没有
  createIntermediateGroups: true

settings:
  base:
    # 这两个要跟 tag 一起往上抬。版本号会进 UA（YanKeApp/x.y）和
    # window.__YANKE_SHELL_VER__ —— 一直写死 1.0 的话，服务端日志里
    # 分不出她手机上装的到底是哪一版（排"弹窗点了没反应"那次就卡在这儿：
    # v1.1 的包报出来也是 1.0）。
    #
    # ⚠ 2026-09-21：这两行**曾经是空转的**。Info.plist 是手写的（GENERATE_INFOPLIST_FILE: NO），
    #   里面直接写死了版本号，跟这儿毫无关系——改这边一点用都没有，得两个文件各改一遍。
    #   v1.4 就是这么漏的（tag 打了 v1.4，装上去报 1.3）。现在 Info.plist 换成了
    #   $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION) 占位符，**这儿才是唯一真相**。
    MARKETING_VERSION: "2.5"
    CURRENT_PROJECT_VERSION: "16"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"          # 只做 iPhone
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # 无签名构建：CI 上没有证书，全能签会重签，这里必须全关掉，
    # 否则 xcodebuild 会去找 provisioning profile 然后失败
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_ENTITLEMENTS: ""

targets:
  YanKe:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared          # FoxAttributes：壳和小组件必须是同一份（两边各写一份＝灵动岛只剩转圈）
      - path: Resources
        excludes:
          - "Info.plist"          # 由 INFOPLIST_FILE 指定，别再当资源打一份进去
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.yanke521.app
        PRODUCT_NAME: YanKe
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: YanKeWidget
        embed: true

  # 桌面小组件（v2.2）。可编辑小组件（AppIntentConfiguration）要 iOS 17，
  # 只抬这个 target，壳本身还是 16 起。
  # ⚠ 重签时 SideStore 会弹「App Contains Extensions」——这个要留，选
  #   「Keep App Extensions (Register App ID for Each Extension)」，选 Remove 小组件就没了。
  YanKeWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget          # Fox/ 里的狐狸 png 也在这儿——图必须进小组件的包，放壳那边它找不到
        excludes:
          - "Info.plist"
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.yanke521.app.widget
        PRODUCT_NAME: YanKeWidget
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
